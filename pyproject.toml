[project]
name = "torun-my-city-backend"
version = "1.0.0"
description = "Flask backend for the Toruń My City app"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.4.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
