[project]
name = "bkihack12"
version = "1.0.0"
description = "Toruń My City hackathon project backend"
requires-python = ">=3.12,<=3.13"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
    "networkx>=3.7",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "ruff>=0.15.5",
    "mypy>=0.950",
    "pyright[nodejs]>=1.1.408",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".pytest_cache", ".ruff_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "graphs", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "__pycache__", "**/node_modules", "**/.*"]
extraPaths = ["src"]
typeCheckingMode = "standard"
venvPath = "./"
venv = ".venv"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportPrivateImportUsage = false
reportUndefinedVariable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::RuntimeWarning:importlib._bootstrap"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
major_version_zero = true
